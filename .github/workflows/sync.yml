name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/MorpheApp/MicroG-RE.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Merge upstream into main
        run: |
          if ! git merge upstream/main --no-edit; then
            echo "::error::Merge conflict detected while syncing upstream into main."
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U | tee conflicted_files.txt
            git merge --abort
            exit 1
          fi

      - name: Push changes
        run: git push origin main
